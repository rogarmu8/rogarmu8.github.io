wer system planning and operation, between many other positive applications. We are going to use Gaussian processes as they can scale to very large datasets, and are non parametric. Moreover, the deep Gaussian processes approach increases their flexibility and precision.\n\n![Image](/projects/tfg/image0.jpg)\n\n[Full Thesis](/projects/tfg/Using_of_Deep_Gaussian_Processes_for_Wind_Energy_Prediction.pdf)","lines":["Bachelor Thesis focused on testing Gaussian Processes and Deep Gaussian Processes to predict","wind energy production. Our experiments will take place in Sotavento, a wind mill complex located in the North of Spain. Wind energy is not constant, the wind mills don’t operate at certain speeds, the infrastructures require a lot of space...","","Therefore, these predictions are crucial as they can avoid power shortages, provide the basis for making decisions in power system planning and operation, between many other positive applications. We are going to use Gaussian processes as they can scale to very large datasets, and are non parametric. Moreover, the deep Gaussian processes approach increases their flexibility and precision.","","![Image](/projects/tfg/image0.jpg)","","[Full Thesis](/projects/tfg/Using_of_Deep_Gaussian_Processes_for_Wind_Energy_Prediction.pdf)"],"assetBase":"/projects/tfg"},{"id":"onesongaday","slug":"onesongaday","title":"One Song A Day","description":"","weight":5,"date":"2021-02-05T07:58:26.000Z","kind":"project","filename":"onesongaday.md","body":"AI Song recommendation android application based on user song reviews. The application was made using Android Studio (Java) and Firebase. A Python server-side application was developed to manage data and populate the database.\n\n![Image](/projects/onesongaday/image0.jpg)\n\n[Google Play Link](https://play.google.com/store/apps/details?id=com.rogarmu8.onesongaday)","lines":["AI Song recommendation android application based on user song reviews. The application was made using Android Studio (Java) and Firebase. A Python server-side application was developed to manage data and populate the database.","","![Image](/projects/onesongaday/image0.jpg)","","[Google Play Link](https://play.google.com/store/apps/details?id=com.rogarmu8.onesongaday)"],"assetBase":"/projects/onesongaday"},{"id":"infogr","slug":"infogr","title":"Basic 3D Engine","description":"","weight":7,"date":"2022-05-05T07:58:26.000Z","kind":"project","filename":"infogr.md","body":"First assignment consisting of a Whitted-style ray tracer. This is a\nrecursive rendering algorithm for determining light transport between one or\nmore light sources and a camera, via scene surfaces, by tracing rays backwards\ninto the scene, starting at the camera.\n\n![Image](/projects/infogr/image0.jpg)\n\nSecond assignment consisting of a basic 3D engine. The 3D engine is a tool\nto visualize a scene graph: a hierarchy of meshes, each of which can have a unique\nlocal transform. Each mesh will have a texture and a shader. The input for the\nshader includes a set of light sources. The shading model implemented in the\nfragment shader determines the response of the materials to these lights. Moreover, some postprocessing techniques such as anti-aliasing are also implemented.\n\n\n[Github Link](https://github.com/rogarmu8/Graphics)","lines":["First assignment consisting of a Whitted-style ray tracer. This is a","recursive rendering algorithm for determining light transport between one or","more light sources and a camera, via scene surfaces, by tracing rays backwards","into the scene, starting at the camera.","","![Image](/projects/infogr/image0.jpg)","","Second assignment consisting of a basic 3D engine. The 3D engine is a tool","to visualize a scene graph: a hierarchy of meshes, each of which can have a unique","local transform. Each mesh will have a texture and a shader. The input for the","shader includes a set of light sources. The shading model implemented in the","fragment shader determines the response of the materials to these lights. Moreover, some postprocessing techniques such as anti-aliasing are also implemented.","","","[Github Link](https://github.com/rogarmu8/Graphics)"],"assetBase":"/projects/infogr"},{"id":"onereferral","slug":"onereferral","title":"OneReferral","description":"One-time payment referral system designed exclusively for Stripe, enabling businesses to manage customer referrals efficiently.","weight":9,"date":"2024-08-15T02:00:00.000Z","kind":"project","filename":"onereferral.md","body":"OneReferral provides a straightforward, one-time payment referral system designed exclusively for Stripe users. By leveraging satisfied customers, businesses can reduce acquisition costs and foster growth through personal recommendations.\n\n# Key Features\n\n- **Dashboard**: Manage customers, campaigns, and track progress with intuitive charts\n- **Diverse Campaigns**: Create campaigns with limited duration discounts, maximum stacking discounts, and support for different currencies\n- **Stripe Integration**: Utilizes Stripe Promo Codes as referral code inputs for seamless integration\n- **Lifetime Access**: Offers a pay-once, access-forever model with options for single projects or unlimited projects\n\n\n[Visit OneReferral](https://www.onereferral.app)","lines":["OneReferral provides a straightforward, one-time payment referral system designed exclusively for Stripe users. By leveraging satisfied customers, businesses can reduce acquisition costs and foster growth through personal recommendations.","","# Key Features","","- **Dashboard**: Manage customers, campaigns, and track progress with intuitive charts","- **Diverse Campaigns**: Create campaigns with limited duration discounts, maximum stacking discounts, and support for different currencies","- **Stripe Integration**: Utilizes Stripe Promo Codes as referral code inputs for seamless integration","- **Lifetime Access**: Offers a pay-once, access-forever model with options for single projects or unlimited projects","","","[Visit OneReferral](https://www.onereferral.app)"],"assetBase":"/projects/onereferral"},{"id":"googlecalendar","slug":"googlecalendar","title":"E-Ink Google Calendar","description":"","weight":12,"date":"2021-01-05T07:58:26.000Z","kind":"project","filename":"googlecalendar.md","body":"E-ink display that connects to your google calendar and retrieves the data from the next 6 days updating every 24 hours.\n\n\n# Parts used:\n\n -  https://www.waveshare.com/wiki/E-Paper_ESP32_Driver_Board\n -  https://www.waveshare.com/product/7.5inch-e-paper.htm\n \n# Explanation:\n \n - We use google scripts to connect to our google calendar and retrieve the needed information.\n - After doing such, from our esp32 we connect to the scripts application and retrieve the data from the html reponse.\n - We give format to the response to have a better integrationwith the e-ink display.\n - We print it to the display using the waveshare library for arduino. (Make sure you have all libraries and drivers download and installed correctly to be able to connect to the display)\n - The data will update every 24 Hours, restarting the device will force an update at any time.\n\n# Example of data retrieved from google scripts:\n\nSat May 08 2021\nLunch with friends                  14:30:00-15:30:00\nDinner with friends                 21:00:00-22:00:00\n|\nSun May 09 2021\nBreakfast                           9:30:00-10:30:00\n|\nMon May 10 2021\nGoing to class                      All day\n|\nTue May 11 2021\nComputer Science Exam               10:00:00-12:00:00\n|\nWed May 12 2021\nStudying for next exam              All day\n|\nThu May 13 2021\nReading                             21:30:00-22:00:00\n\n\n\n[Github Link](https://github.com/rogarmu8/E-INK-Google-Calendar)","lines":["E-ink display that connects to your google calendar and retrieves the data from the next 6 days updating every 24 hours.","","","# Parts used:",""," -  https://www.waveshare.com/wiki/E-Paper_ESP32_Driver_ acing rays backwards"},{"fileId":"infogr","filename":"infogr.md","title":"Basic 3D Engine","line":4,"text":"into the scene, starting at the camera."},{"fileId":"infogr","filename":"infogr.md","title":"Basic 3D Engine","line":6,"text":"![Image](/projects/infogr/image0.jpg)"},{"fileId":"infogr","filename":"infogr.md","title":"Basic 3D Engine","line":8,"text":"Second assignment consisting of a basic 3D engine. The 3D engine is a tool"},{"fileId":"infogr","filename":"infogr.md","title":"Basic 3D Engine","line":9,"text":"to visualize a scene graph: a hierarchy of meshes, each of which can have a unique"},{"fileId":"infogr","filename":"infogr.md","title":"Basic 3D Engine","line":10,"text":"local transform. Each mesh will have a texture and a shader. The input for the"},{"fileId":"infogr","filename":"infogr.md","title":"Basic 3D Engine","line":11,"text":"shader includes a set of light sources. The shading model implemented in the"},{"fileId":"infogr","filename":"infogr.md","title":"Basic 3D Engine","line":12,"text":"fragment shader determines the response of the materials to these lights. Moreover, some postprocessing techniques such as anti-aliasing are also implemented."},{"fileId":"infogr","filename":"infogr.md","title":"Basic 3D Engine","line":15,"text":"[Github Link](https://github.com/rogarmu8/Graphics)"},{"fileId":"onereferral","filename":"onereferral.md","title":"OneReferral","line":1,"text":"OneReferral provides a straightforward, one-time payment referral system designed exclusively for Stripe users. By leveraging satisfied customers, businesses can reduce acquisition costs and foster growth through personal recommendations."},{"fileId":"onereferral","filename":"onereferral.md","title":"OneReferral","line":3,"text":"# Key Features"},{"fileId":"onereferral","filename":"onereferral.md","title":"OneReferral","line":5,"text":"- **Dashboard**: Manage customers, campaigns, and track progress with intuitive charts"},{"fileId":"onereferral","filename":"onereferral.md","title":"OneReferral","line":6,"text":"- **Diverse Campaigns**: Create campaigns with limited duration discounts, maximum stacking discounts, and support for different currencies"},{"fileId":"onereferral","filename":"onereferral.md","title":"OneReferral","line":7,"text":"- **Stripe Integration**: Utilizes Stripe Promo Codes as referral code inputs for seamless integration"},{"fileId":"onereferral","filename":"onereferral.md","title":"OneReferral","line":8,"text":"- **Lifetime Access**: Offers a pay-once, access-forever model with options for single projects or unlimited projects"},{"fileId":"onereferral","filename":"onereferral.md","title":"OneReferral","line":11,"text":"[Visit OneReferral](https://www.onereferral.app)"},{"fileId":"googlecalendar","filename":"googlecalendar.md","title":"E-Ink Google Calendar","line":1,"text":"E-ink display that connects to your google calendar and retrieves the data from the next 6 days updating every 24 hours."},{"fileId":"googlecalendar","filename":"googlecalendar.md","title":"E-Ink Google Calendar","line":4,"text":"# Parts used:"},{"fileId":"googlecalendar","filename":"googlecalendar.md","title":"E-Ink Google Calendar","line":6,"text":" -  https://www.waveshare.com/wiki/E-Paper_ESP32_Driver_Board"},{"fileId":"googlecalendar","filename":"googlecalendar.md","title":"E-Ink Google Calendar","line":7,"text":" -  https://www.waveshare.com/product/7.5inch-e-paper.htm"},{"fileId":"googlecalendar","filename":"googlecalendar.md","title":"E-Ink Google Calendar","line":9,"text":"# Explanation:"},{"fileId":"googlecalendar","filename":"googlecalendar.md","title":"E-Ink Google Calendar","line":11,"text":" - We use google scripts to connect to our google calendar and retrieve the needed information."},{"fileId":"googlecalendar","filename":"googlecalendar.md","title":"E-Ink Google Calendar","line":12,"text":" - After doing such, from our esp32 we connect to the scripts application and retrieve the data from the html reponse."},{"fileId":"googlecalendar","filename":"googlecalendar.md","title":"E-Ink Google Calendar","line":13,"text":" - We give format to the response to have a better integrationwith the e-ink display."},{"fileId":"googlecalendar","filename":"googlecalendar.md","title":"E-Ink Google Calendar","line":14,"text":" - We print it to the display using the waveshare library for arduino. (Make sure you have all libraries and drivers download and installed correctly to be able to connect to the display)"},{"fileId":"googlecalendar","filename":"googlecalendar.md","title":"E-Ink Google Calendar","line":15,"text":" - The data will update every 24 Hours, restarting the device will force an update at any time."},{"fileId":"googlecalendar","filename":"googlecalendar.md","title":"E-Ink Google Calendar","line":17,"text":"# Example of data retrieved from google scripts:"},{"fileId":"googlecalendar","filename":"googlecalendar.md","title":"E-Ink Google Calendar","line":19,"text":"Sat May 08 2021"},{"fileId":"googlecalendar","filename":"googlecalendar.md","title":"E-Ink Google Calendar","line":20,"text":"Lunch with friends                  14:30:00-15:30:00"},{"fileId":"googlecalendar","filename":"googlecalendar.md","title":"E-Ink Google Calendar","line":21,"text":"Dinner with friends                 21:00:00-22:00:00"},{"fileId":"googlecalendar","filename":"googlecalendar.md","title":"E-Ink Google Calendar","line":22,"text":"|"},{"fileId":"googlecalendar","filename":"googlecalendar.md","title":"E-Ink Google Calendar","line":23,"text":"Sun May 09 2021"},{"fileId":"googlecalendar","filename":"googlecalendar.md","title":"E-Ink Google Calendar","line":24,"text":"Breakfast                           9:30:00-10:30:00"},{"fileId":"googlecalendar","filename":"googlecalendar.md","title":"E-Ink Google Calendar","line":25,"text":"|"},{"fileId":"googlecalendar","filename":"googlecalendar.md","title":"E-Ink Google Calendar","line":26,"text":"Mon May 10 2021"},{"fileId":"googlecalendar","filename":"googlecalendar.md","title":"E-Ink Google Calendar","line":27,"text":"Going to class                      All day"},{"fileId":"googlecalendar","filename":"googlecalendar.md","title":"E-Ink Google Calendar","line":28,"text":"|"},{"fileId":"googlecalendar","filename":"googlecalendar.md","title":"E-Ink Google Calendar","line":29,"text":"Tue May 11 2021"},{"fileId":"googlecalendar","filename":"googlecalendar.md","title":"E-Ink Google Calendar","line":30,"text":"Computer Science Exam               10:00:00-12:00:00"},{"fileId":"googlecalendar","filename":"googlecalendar.md","title":"E-Ink Google Calendar","line":31,"text":"|"},{"fileId":"googlecalendar","filename":"googlecalendar.md","title":"E-Ink Google Calendar","line":32,"text":"Wed May 12 2021"},{"fileId":"googlecalendar","filename":"googlecalendar.md","title":"E-Ink Google Calendar","line":33,"text":"Studying for next exam              All day"},{"fileId":"googlecalendar","filename":"googlecalendar.md","title":"E-Ink Google Calendar","line":34,"text":"|"},{"fileId":"googlecalendar","filename":"googlecalendar.md","title":"E-Ink Google Calendar","line":35,"text":"Thu May 13 2021"},{"fileId":"googlecalendar","filename":"googlecalendar.md","title":"E-Ink Google Calendar","line":36,"text":"Reading                             21:30:00-22:00:00"},{"fileId":"googlecalendar","filename":"googlecalendar.md","title":"E-Ink Google Calendar","line":40,"text":"[Github Link](https://github.com/rogarmu8/E-INK-Google-Calendar)"},{"fileId":"clickycode","filename":"clickycode.md","title":"Clicky Code","line":1,"text":"Clicker video game with room decoration management. Game made with Unity(C#), Photoshop, Bosca Ceoil."},{"fileId":"clickycode","filename":"clickycode.md","title":"Clicky Code","line":3,"text":"![Image](/projects/clickycode/image0.jpg)"},{"fileId":"clickycode","filename":"clickycode.md","title":"Clicky Code","line":5,"text":"[Google Play Link](https://play.google.com/store/apps/details?id=com.rogarmu8.clickycode)"},{"fileId":"fallendots","filename":"fa
