** — system design calls across hardware, edge, and cloud as the stack takes shape","- **Branding & PR** — early narrative, positioning, and how the company shows up outside the lab","","[Visit nutsh.io](https://www.nutsh.io)"],"assetBase":"/experience/nutsh-io"},{"id":"gmv","slug":"gmv","title":"GMV","description":"AI Team Lead — R&D for European defense, 2023–present.","order":2,"kind":"experience","filename":"gmv.md","body":"**AI Team Lead** at [GMV](https://www.gmv.com) · **2023 – present**\n\nLead R&D on AI implementations for **European defense** programs — from research prototypes to systems that have to hold up in production.\n\n# Focus\n\n- Leading an AI engineering team end-to-end\n- Applied ML / computer vision in defense contexts\n- Shipping fullstack pieces around the models (APIs, tooling, deployment)\n\nStack I touch often here: **Java**, **Python**, **PyTorch**, **OpenCV**, **Docker**, **Kubernetes**, plus whatever the program needs next.","lines":["**AI Team Lead** at [GMV](https://www.gmv.com) · **2023 – present**","","Lead R&D on AI implementations for **European defense** programs — from research prototypes to systems that have to hold up in production.","","# Focus","","- Leading an AI engineering team end-to-end","- Applied ML / computer vision in defense contexts","- Shipping fullstack pieces around the models (APIs, tooling, deployment)","","Stack I touch often here: **Java**, **Python**, **PyTorch**, **OpenCV**, **Docker**, **Kubernetes**, plus whatever the program needs next."],"assetBase":"/experience/gmv"},{"id":"100-vibe-coding","slug":"100-vibe-coding","title":"100 Vibe Coding","description":"Co-founded AI coding challenges platform — PH #3 Product of the Day, ~2k MAU.","order":1,"kind":"project","filename":"100-vibe-coding.md","body":"Co-founded **100 Vibe Coding** — an AI-powered platform that teaches people to ship projects through 100 progressive challenges. Focus: prompting well and moving from idea to working build fast.\n\n**Role & stack:** Co-founder · TypeScript, Next.js, Supabase\n\n**Impact:** ~2k monthly active users · **Product Hunt #3** Product of the Day\n\n![100 Vibe Coding challenges](/projects/100-vibe-coding/cover.png)\n\n# Key Features\n\n- **Progressive Challenges**: 100 challenges that adapt to how you code\n- **Sandbox Environment**: Test ideas and build in an interactive sandbox\n- **Real-Time Feedback**: Immediate feedback while you learn\n- **Gamified Experience**: A game-like path through the curriculum\n- **Project Showcase**: Browse what others have shipped with Vibe Coding\n\n# Getting Started\n\nStart with 10 free challenges — no credit card. Learn to use AI as a real building partner, not just a chat toy.\n\n\n<iframe class=\"yt\" src=\"https://www.youtube.com/embed/2a5PoiZeejo?enablejsapi=1\" title=\"YouTube video\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" allowfullscreen loading=\"lazy\"></iframe>\n\n\n[Visit 100 Vibe Coding](https://www.100vibecoding.com)","lines":["Co-founded **100 Vibe Coding** — an AI-powered platform that teaches people to ship projects through 100 progressive challenges. Focus: prompting well and moving from idea to working build fast.","","**Role & stack:** Co-founder · TypeScript, Next.js, Supabase","","**Impact:** ~2k monthly active users · **Product Hunt #3** Product of the Day","","![100 Vibe Coding challenges](/projects/100-vibe-coding/cover.png)","","# Key Features","","- **Progressive Challenges**: 100 challenges that adapt to how you code","- **Sandbox Environment**: Test ideas and build in an interactive sandbox","- **Real-Time Feedback**: Immediate feedback while you learn","- **Gamified Experience**: A game-like path through the curriculum","- **Project Showcase**: Browse what others have shipped with Vibe Coding","","# Getting Started","","Start with 10 free challenges — no credit card. Learn to use AI as a real building partner, not just a chat toy.","","","<iframe class ero to paying users","","# Key Features","","- **AI Plan Generator**: Meal plans tailored to each client in seconds","- **Extensive Meal Database**: Large meal library plus custom recipes","- **Interactive Plans**: Shareable plans with client feedback loops","- **PDF Export**: Customizable exports in multiple languages","- **Client Management**: Contacts and communication in one place","- **Progress Tracking**: Adjust plans from real client results","","<video controls poster=\"https://storage.googleapis.com/nutrai-videos/play.webp\" style=\"width: 100%; height: auto;\">","  <source src=\"https://storage.googleapis.com/nutrai-videos/nutrai_v3_en.webm\" type=\"video/webm\">","</video>","","[Visit NutrAI](https://www.nutrai.app)"],"assetBase":"/projects/nutrai"},{"id":"kloom-studios","slug":"kloom-studios","title":"Kloom Studios","description":"Co-founded Smart Target — projector games for axe throwing & darts, live in 7+ countries.","order":3,"kind":"project","filename":"kloom-studios.md","body":"Co-founded **Kloom Studios** — **Smart Target**, a digital gaming system for axe throwing venues and bars. Interactive games are projected onto wooden targets and dartboards; a tablet app runs the session and scores throws automatically.\n\n**Role & stack:** Co-founder · solo build · Python, Godot\n\n**Impact:** **7+ countries** · **100K+** players · **20+** games\n\n# How it works\n\n1. **Tablet app** — pick from 20+ games for all skill levels\n2. **Projector** — overlays the game on the physical target or dartboard\n3. **Play** — automatic score tracking, no calibration\n\n# Products\n\n- **Axe throwing** — tic-tac-toe, battleship, trivia, 501, team challenges, tournaments, and more; sessions from 30 minutes to 2 hours\n- **Darts** — classic modes (501, cricket, around the clock, …) on any standard board\n\n# Why venues use it\n\n- New games and seasonal templates without hardware swaps\n- Higher spend and better guest experience\n- Less staff time on scoring and setup\n- Targets last longer (digital overlays, less wear)\n- Auto-generated shareable content for social\n\n![Axe throwing gameplay](/projects/kloom-studios/image0.jpg)\n\n![Smart Target in venue](/projects/kloom-studios/image1.jpg)\n\n[Visit Kloom Studios](https://www.kloomstudios.com)","lines":["Co-founded **Kloom Studios** — **Smart Target**, a digital gaming system for axe throwing venues and bars. Interactive games are projected onto wooden targets and dartboards; a tablet app runs the session and scores throws automatically.","","**Role & stack:** Co-founder · solo build · Python, Godot","","**Impact:** **7+ countries** · **100K+** players · **20+** games","","# How it works","","1. **Tablet app** — pick from 20+ games for all skill levels","2. **Projector** — overlays the game on the physical target or dartboard","3. **Play** — automatic score tracking, no calibration","","# Products","","- **Axe throwing** — tic-tac-toe, battleship, trivia, 501, team challenges, tournaments, and more; sessions from 30 minutes to 2 hours","- **Darts** — classic modes (501, cricket, around the clock, …) on any standard board","","# Why venues use it","","- New games and seasonal templates without hardware swaps","- Higher spend and better guest experience","- Less staff time on scoring and setup","- Targets last longer (digital overlays, less wear)","- Auto-generated shareable content for social","","![Axe throwing gameplay](/projects/kloom-studios/image0.jpg)","","![Smart Target in venue](/projects/kloom-studios/image1.jpg)","","[Visit Kloom Studios](https://www.kloomstudios.com)"],"assetBase":"/projects/kloom-studios"},{"id":"wind-energy-prediction","slug":"wind-energy-prediction","title":"Wind Energy Prediction","description":"Bachelor thesis — Deep Gaussian Processes for wind energy forecasting at Sotavento.","order":4,"kind":"project","filename":"wind-energy-prediction.md","body":"Bachelor thesis on **Gaussian Processes** and **Deep Gaussian Processes** for wind energy production forecasting. Experiments at Sotavento, a wind farm in northern Spain — where output swings with wind speed and plant constraints, so better forecasts matter for grid planning and avoiding shortages.\n\nGPs scale to large datasets and stay non-parametric; stacking them as deep GPs adds flexibility and precision.\n\n![Deep Gaussian Process model](/projects/wind-energy-prediction/cover.jpg)\n\n![Thesis overview](/projects/wind-energy-prediction/image0.jpg)\n\n[Full Thesis (PDF)](/projects/wind-energy-prediction/Using_of_Deep_Gaussian_Processes_for_Wind_Energy_Prediction.pdf)","lines":["Bachelor thesis on **Gaussian Processes** and **Deep Gaussian Processes** for wind energy production forecasting. Experiments at Sotavento, a wind farm in northern Spain — where output swings with wind speed and plant constraints, so better forecasts matter for grid planning and avoiding shortages.","","GPs scale to large datasets and stay non-parametric; stacking them as deep GPs adds flexibility and precision.","","![Deep Gaussian Process model](/projects/wind-energy-prediction/cover.jpg)","","![Thesis overview](/projects/wind-energy-prediction/image0.jpg)","","[Full Thesis (PDF)](/projects/wind-energy-prediction/Using_of_Deep_Gaussian_Processes_for_Wind_Energy_Prediction.pdf)"],"assetBase":"/projects/wind-energy-prediction"},{"id":"stif-works","slug":"stif-works","title":"stif.works","description":"AI matching for digital freelancers — built and validated in one week, then closed.","order":5,"kind":"project","filename":"stif-works.md","body":"**stif.works** — describe what you need; an AI agent matches you with digital professionals. Flat monthly fee for pros, no cut of their jobs.\n\n![stif.works](/projects/stif-works/cover.png)\n\nBuilt and tried to validate the idea in **one week**: ideation → product → outreach. Professionals were interested, but **finding customers for them** didn’t stick — buyers wanted more context than an agent match alone. We closed it.\n\nStill a clean loop: ship fast, talk to users, kill what doesn’t convert. Cool week.\n\n[Visit stif.works](https://stif.works) · [Manifesto](https://stif.works/manifesto)","lines":["**stif.works** — describe what you need; an AI agent matches you with digital professionals. Flat monthly fee for pros, no cut of their jobs.","","![stif.works](/projects/stif-works/cover.png)","","Built and tried to validate the idea in **one week**: ideation → product → outreach. Professionals were interested, but **finding customers for them** didn’t stick — buyers wanted more context than an agent match alone. We closed it.","","Still a clean loop: ship fast, talk to users, kill what doesn’t convert. Cool week.","","[Visit stif.works](https://stif.works) · [Manifesto](https://stif.works/manifesto)"],"assetBase":"/projects/stif-works"},{"id":"cifras-del-mundo","slug":"cifras-del-mundo","title":"Cifras del Mundo","description":"Multiplayer numeric trivia about global stats — shipped in a weekend.","order":6,"kind":"project","filename":"cifras-del-mundo.md","body":"**Cifras del Mundo** — multiplayer numeric trivia about global stats and facts. Shipped in a weekend: compete on how close you can get to the real number.\n\n![Cifras del Mundo](/projects/cifras-del-mundo/cover.png)\n\n# Key Features\n\n- **Multiplayer Mode**: Play with friends and others worldwide\n- **Diverse Question Bank**: Global statistics across many topics\n- **Fast UX**: Built for quick rounds, not lecture mode\n- **Weekend ship**: From idea to live game in a few days\n\n# Gameplay\n\nGuess the number behind world facts — entertaining, a bit educational, and competitive when friends are in the lobby.\n\n[Play Cifras del Mundo](https://www.cifrasdelmundo.com)","lines":["**Cifras del Mundo** — multiplayer numeric trivia about global stats and facts. Shipped in a weekend: compete on how close you can get to the real number.","","![Cifras del Mundo](/projects/cifras-del-mundo/cover.png)","","# Key Features","","- **Multiplayer Mode**: Play with friends and others worldwide","- **Diverse Question Bank**: Global statistics across many topics","- **Fast UX**: Built for quick rounds, not lecture mode","- **Weekend ship**: From idea to live game in a few days","","# Gameplay","","Guess the number behind world facts — entertaining, a bit educational, and competitive when friends are in the lobby.","","[Play Cifras del Mundo](https://www.cifrasdelmundo.com)"],"assetBase":"/projects/cifras-del-mundo"},{"id":"one-song-a-day","slug":"one-song-a-day","title":"One Song A Day","description":"AI music recommendation Android app driven by personal song reviews.","order":7,"kind":"project","filename":"one-song-a-day.md","body":"**One Song a Day** — AI music recommendations based on how you review tracks. Built to surface the next listen from your own taste, not generic charts.\n\n**Stack:** Android (Java) · Firebase · Python backend for data and recommendations\n\n![One Song a Day](/projects/one-song-a-day/cover.jpg)\n\n![App screens](/projects/one-song-a-day/image0.jpg)\n\n[Google Play](https://play.google.com/store/apps/details?id=com.rogarmu8.onesongaday)","lines":["**One Song a Day** — AI music recommendations based on how you review tracks. Built to surface the next listen from your own taste, not generic charts.","","**Stack:** Android (Java) · Firebase · Python backend for data and recommendations","","![One Song a Day](/projects/one-song-a-day/cover.jpg)","","![App screens](/projects/one-song-a-day/image0.jpg)","","[Google Play](https://play.google.com/store/apps/details?id=com.rogarmu8.onesongaday)"],"assetBase":"/projects/one-song-a-day"},{"id":"basic-3d-engine","slug":"basic-3d-engine","title":"Basic 3D Engine","description":"Ray tracer + scene-graph engine — Utrecht University Infographics, OpenTK/C#.","order":8,"kind":"project","filename":"basic-3d-engine.md","body":"Assignments from a year abroad at **Utrecht University** (Infographics) using **OpenTK** and **C#**.\n\n![Perspective projection](/projects/basic-3d-engine/cover.jpg)\n\nFirst assignment: a **Whitted-style ray tracer** — recursive light transport from camera through scene surfaces to light sources.\n\n![Ray tracer spheres](/projects/basic-3d-engine/image0.jpg)\n\nSecond assignment: a basic **3D engine** to visualize a scene graph (meshes with local transforms, textures, shaders, lights) plus post-processing such as anti-aliasing.\n\n[GitHub](https://github.com/rogarmu8/Graphics)","lines":["Assignments from a year abroad at **Utrecht University** (Infographics) using **OpenTK** and **C#**.","","![Perspective projection](/projects/basic-3d-engine/cover.jpg)","","First assignment: a **Whitted-style ray tracer** — recursive light transport from camera through scene surfaces to light sources.","","![Ray tracer spheres](/projects/basic-3d-engine/image0.jpg)","","Second assignment: a basic **3D engine** to visualize a scene graph (meshes with local transforms, textures, shaders, lights) plus post-processing such as anti-aliasing.","","[GitHub](https://github.com/rogarmu8/Graphics)"],"assetBase":"/projects/basic-3d-engine"},{"id":"one-referral","slug":"one-referral","title":"OneReferral","description":"Stripe-native one-time payment referral system — pay once, run campaigns forever.","order":9,"kind":"project","filename":"one-referral.md","body":"**OneReferral** — a one-time payment referral system built exclusively for Stripe. Turn happy customers into acquisition: lower CAC through personal recommendations, without a recurring SaaS tax on the tool itself.\n\n![OneReferral](/projects/one-referral/cover.jpg)\n\n# Key Features\n\n- **Dashboard**: Manage customers, campaigns, and track progress with charts\n- **Diverse Campaigns**: Limited-duration discounts, stacking caps, multi-currency\n- **Stripe Integration**: Promo codes as referral inputs\n- **Lifetime Access**: Pay once — single project or unlimited\n\n[Visit OneReferral](https://www.onereferral.app)","lines":["**OneReferral** — a one-time payment referral system built exclusively for Stripe. Turn happy customers into acquisition: lower CAC through personal recommendations, without a recurring SaaS tax on the tool itself.","","![OneReferral](/projects/one-referral/cover.jpg)","","# Key Features","","- **Dashboard**: Manage customers, campaigns, and track progress with charts","- **Diverse Campaigns**: Limited-duration discounts, stacking caps, multi-currency","- **Stripe Integration**: Promo codes as referral inputs","- **Lifetime Access**: Pay once — single project or unlimited","","[Visit OneReferral](https://www.onereferral.app)"],"assetBase":"/projects/one-referral"},{"id":"e-ink-google-calendar","slug":"e-ink-google-calendar","title":"E-Ink Google Calendar","description":"ESP32 e-paper display that pulls the next 6 days from Google Calendar.","order":10,"kind":"project","filename":"e-ink-google-calendar.md","body":"E-ink display that connects to Google Calendar, shows the next **6 days**, and refreshes every **24 hours** (or on reboot).\n\n![E-ink calendar display](/projects/e-ink-google-calendar/cover.jpg)\n\n# Parts\n\n- [Waveshare E-Paper ESP32 Driver Board](https://www.waveshare.com/wiki/E-Paper_ESP32_Driver_Board)\n- [7.5\" e-paper panel](https://www.waveshare.com/product/7.5inch-e-paper.htm)\n\n# How it works\n\n1. Google Apps Script reads the calendar and exposes the next days as HTML\n2. ESP32 fetches that payload\n3. Response is laid out for the e-paper panel\n4. Waveshare Arduino libs draw the frame; restart forces a refresh anytime\n\n[GitHub](https://github.com/rogarmu8/E-INK-Google-Calendar)","lines":["E-ink display that connects to Google Calendar, shows the next **6 days**, and refreshes every **24 hours** (or on reboot).","","![E-ink calendar display](/projects/e-ink-google-calendar/cover.jpg)","","# Parts","","- [Waveshare E-Paper ESP32 Driver Board](https://www.waveshare.com/wiki/E-Paper_ESP32_Driver_Board)","- [7.5\" e-paper panel](https://www.waveshare.com/product/7.5inch-e-paper.htm)","", ","","![Fallen Dots](/projects/fallen-dots/cover.jpg)","","![Screens](/projects/fallen-dots/image0.jpg)","","[Google Play](https://play.google.com/store/apps/details?id=com.rogarmu8Games.FallenDots)"],"assetBase":"/projects/fallen-dots"},{"id":"about-me","slug":"about-me","title":"About me","description":"Spanish builder shipping end-to-end — Madrid","order":0,"kind":"about","filename":"about-me.md","body":"I'm a Spanish builder who loves shipping little projects that make other people's lives easier. Co-founded [**100 Vibe Coding**](~/projects/100-vibe-coding.md) and [**NutrAI**](~/projects/nutrai.md). From ideation to paying customers — I like connecting with purpose-aligned people and getting things out the door.\n\n![Image](/about/image.jpg)\n\n# Background\n\nTinkerer since I was 6. Always wanted to be an inventor; computer science let me create without a budget. Based in Madrid (from Menorca, 2000). I like understanding how things work, simplifying real problems, and learning a bit more every day.\n\nStudied Computer Science at the Autonomous University of Madrid, with a year abroad at Utrecht University.\n\n# What I've shipped\n\n- **Product Hunt #3** — Product of the Day with [100 Vibe Coding](~/projects/100-vibe-coding.md) (~2k MAU)\n- **B2B traction** — cold-called until **40+ professionals** were using [NutrAI](~/projects/nutrai.md)\n- **15+ side projects** — some live in this portfolio; others include [Kloom Studios](~/projects/kloom-studios.md) (7+ countries, 100K+ players), [OneReferral](~/projects/one-referral.md), [One Song a Day](~/projects/one-song-a-day.md), [Clicky Code](~/projects/clicky-code.md), [Cifras del Mundo](~/projects/cifras-del-mundo.md)\n\n# Day job\n\nStill building in two places:\n\n- **[Founding engineer @ nutsh.io](~/experience/nutsh-io.md)** (Dec 2025–present) — Brain-AI Interface: embedded software, 3D, AI infra (SkyPilot), architecture, branding\n- **[AI Team Lead @ GMV](~/experience/gmv.md)** (2023–present) — R&D on AI for European defense\n\n# Outside the IDE\n\nI like building in general — from sewing bags to R/C submarines. Team sports (football, padel), scuba, ex-violinist. Practiced cardistry for three years and built a small community around it in Madrid.","lines":["I'm a Spanish builder who loves shipping little projects that make other people's lives easier. Co-founded [**100 Vibe Coding**](~/projects/100-vibe-coding.md) and [**NutrAI**](~/projects/nutrai.md). From ideation to paying customers — I like connecting with purpose-aligned people and getting things out the door.","","![Image](/about/image.jpg)","","# Background","","Tinkerer since I was 6. Always wanted to be an inventor; computer science let me create without a budget. Based in Madrid (from Menorca, 2000). I like understanding how things work, simplifying real problems, and learning a bit more every day.","","Studied Computer Science at the Autonomous University of Madrid, with a year abroad at Utrecht University.","","# What I've shipped","","- **Product Hunt #3** — Product of the Day with [100 Vibe Coding](~/projects/100-vibe-coding.md) (~2k MAU)","- **B2B traction** — cold-called until **40+ professionals** were using [NutrAI](~/projects/nutrai.md)","- **15+ side projects** — some live in this portfolio; others include [Kloom Studios](~/projects/kloom-studios.md) (7+ countries, 100K+ players), [OneReferral](~/projects/one-referral.md), [One Song a Day](~/projects/one-song-a-day.md), [Clicky Code](~/projects/clicky-code.md), [Cifras del Mundo](~/projects/cifras-del-mundo.md)","","# Day job","","Still building in two places:","","- **[Founding engineer @ nutsh.io](~/experience/nutsh-io.md)** (Dec 2025–present) — Brain-AI Interface: embedded software, 3D, AI infra (SkyPilot), architecture, branding","- **[AI Team Lead @ GMV](~/experience/gmv.md)** (2023–present) — R&D on AI for European defense","","# Outside the IDE","","I like building in general — from sewing bags to R/C submarines. Team sports (football, padel), s
